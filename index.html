<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎡 빙글빙글 1.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;min-height:100vh;padding:1rem}
.app{max-width:440px;margin:0 auto}
.logo{text-align:center;margin-bottom:1.25rem;padding-top:.5rem}
.logo h1{font-size:22px;font-weight:600;color:#1a1a18}
.logo p{font-size:13px;color:#888780;margin-top:3px}
.card{background:#fff;border:.5px solid #D3D1C7;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
.lbl{font-size:12px;font-weight:500;color:#5F5E5A;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid #97C459;border-radius:10px;overflow:hidden}
.seg3 button{padding:11px 0;font-size:14px;font-weight:500;background:none;border:none;cursor:pointer;color:#3B6D11;transition:background .15s,color .15s}
.seg3 button+button{border-left:1px solid #97C459}
.seg3 button.active{background:#3B6D11;color:#fff}
.seg3 button:not(.active):hover{background:#EAF3DE}
input[type=time],input[type=text]{height:36px;border:.5px solid #D3D1C7;border-radius:8px;padding:0 10px;font-size:14px;outline:none;font-family:inherit;color:#1a1a18}
input:focus{border-color:#97C459;box-shadow:0 0 0 2px #EAF3DE}
.input-row{display:flex;gap:8px;margin-bottom:8px}
.input-row input{flex:1}
.add-btn{height:36px;padding:0 16px;background:#fff;border:.5px solid #D3D1C7;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;color:#1a1a18}
.add-btn:hover{background:#f5f5f3}
.tags{display:flex;flex-wrap:wrap;gap:5px;min-height:28px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.tag-m{background:#EAF3DE;color:#27500A}
.tag-f{background:#FAEEDA;color:#633806}
.tag button{background:none;border:none;cursor:pointer;font-size:14px;line-height:1;padding:0;color:inherit;opacity:.5}
.tag button:hover{opacity:1}
.cnt{font-size:12px;color:#B4B2A9;margin-left:auto}
.gen-btn{width:100%;padding:13px;font-size:15px;font-weight:500;background:#3B6D11;color:#fff;border:none;border-radius:12px;cursor:pointer;margin-top:4px;transition:opacity .15s,transform .1s}
.gen-btn:hover{opacity:.88}
.gen-btn:active{transform:scale(.98)}
.err{font-size:13px;color:#E24B4A;margin-top:6px;min-height:18px}
.dl-btn{display:flex;align-items:center;gap:6px;padding:11px 24px;font-size:14px;font-weight:500;background:#3B6D11;color:#fff;border:none;border-radius:8px;cursor:pointer;margin:0 auto;transition:opacity .15s}
.dl-btn:hover{opacity:.88}
</style>
</head>
<body>
<div class="app">
  <div class="logo">
    <h1>🎡 빙글빙글룰렛</h1>
    <p>남녀 라운드 미팅 스케줄러</p>
  </div>
  <div class="card">
    <div class="lbl">⏰ 시작 시간</div>
    <input type="time" id="startTime" value="19:40">
  </div>
  <div class="card">
    <div class="lbl">⏱ 라운드 시간 <span style="margin-left:auto;font-size:11px;color:#B4B2A9">사이 이동 5분 포함</span></div>
    <div class="seg3" id="durSeg">
      <button onclick="setDur(15,this)">15분</button>
      <button class="active" onclick="setDur(20,this)">20분</button>
      <button onclick="setDur(30,this)">30분</button>
    </div>
  </div>
  <div class="card">
    <div class="lbl" style="color:#27500A">👨 형제 (남자) <span class="cnt" id="mCnt">0명</span></div>
    <div class="input-row">
      <input type="text" id="mIn" placeholder="닉네임 입력" onkeydown="if(event.key==='Enter')addN('m')">
      <button class="add-btn" onclick="addN('m')">추가</button>
    </div>
    <div class="tags" id="mTags"></div>
  </div>
  <div class="card">
    <div class="lbl" style="color:#633806">👩 자매 (여자) <span class="cnt" id="fCnt">0명</span></div>
    <div class="input-row">
      <input type="text" id="fIn" placeholder="닉네임 입력" onkeydown="if(event.key==='Enter')addN('f')">
      <button class="add-btn" onclick="addN('f')">추가</button>
    </div>
    <div class="tags" id="fTags"></div>
  </div>
  <div class="err" id="err"></div>
  <button class="gen-btn" onclick="generate()">랜덤 스케줄 생성하기</button>
  <div id="out" style="margin-top:1.25rem"></div>
</div>
<script>
let males=[],females=[],dur=20;

function setDur(d,btn){
  dur=d;
  document.querySelectorAll('#durSeg button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function addN(g){
  const el=document.getElementById(g==='m'?'mIn':'fIn');
  const v=el.value.trim();if(!v)return;
  const arr=g==='m'?males:females;
  if(arr.includes(v)){el.value='';return;}
  arr.push(v);el.value='';renderTags(g);
}
function removeN(g,name){
  if(g==='m')males=males.filter(x=>x!==name);
  else females=females.filter(x=>x!==name);
  renderTags(g);
}
function renderTags(g){
  const arr=g==='m'?males:females;
  document.getElementById(g==='m'?'mCnt':'fCnt').textContent=arr.length+'명';
  document.getElementById(g==='m'?'mTags':'fTags').innerHTML=
    arr.map(n=>`<span class="tag tag-${g}">${n}<button onclick="removeN('${g}','${n}')" aria-label="삭제">×</button></span>`).join('');
}
function fmtT(base,rIdx){
  const [hh,mm]=base.split(':').map(Number);
  const s=hh*60+mm+rIdx*(dur+5),e=s+dur;
  const f=m=>`${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
  return f(s)+'~'+f(e);
}

function buildSchedule(males, females){
  const nm=males.length, nf=females.length;
  // 적은 쪽이 고정(테이블), 많은 쪽이 이동
  // 테이블 수 = 적은 쪽 인원
  // 라운드 수 = 많은 쪽 인원
  // 매 라운드: 이동하는 쪽이 오른쪽으로 한 칸씩 shift
  // 테이블 수보다 많은 이동자 → 휴식

  const fixedIsMale = nm <= nf;
  const fixed  = fixedIsMale ? males   : females;  // 테이블에 앉는 쪽
  const moving = fixedIsMale ? females : males;    // 이동하는 쪽
  const nFixed  = fixed.length;   // 테이블 수
  const nMoving = moving.length;  // 이동자 수
  const rounds  = nMoving;        // 라운드 수 = 많은 쪽

  // schedule[r][t] = 라운드r, 테이블t에 앉는 이동자 인덱스 (null = 빈 테이블)
  // restPerRound[r] = 라운드r에 쉬는 이동자 이름 배열
  const schedule = [];
  const restPerRound = [];

  for(let r=0; r<rounds; r++){
    const row = [];
    const resting = [];
    for(let t=0; t<nFixed; t++){
      // 이동자 인덱스: 라운드0에서 이동자0이 테이블0에 앉고,
      // 매 라운드 오른쪽으로 한 칸씩 → 테이블t에는 이동자 (t - r + nMoving) % nMoving 가 앉음
      // 단 이 인덱스가 nFixed 이상이면 "휴식 중인 사람"이 테이블에 앉으려는 것 → null
      // 실제로는: 이동자를 배열로 보고, 매 라운드 배열을 왼쪽으로 1칸 shift
      // 즉 라운드r에서 테이블t에 앉는 이동자 = moving[(t + r) % nMoving]
      // 단, nMoving > nFixed 일 때 일부 이동자는 테이블 없이 휴식
      // 이동자 (t+r)%nMoving 이 테이블t에 앉되, 테이블은 nFixed개뿐
      // → 이동자 인덱스 mi = (t + r) % nMoving, 항상 유효
      const mi = (t + r) % nMoving;
      row.push(mi);
    }
    // 휴식: nMoving명 중 테이블에 배정되지 않은 이동자
    const seated = new Set(row);
    for(let mi=0; mi<nMoving; mi++){
      if(!seated.has(mi)) resting.push(moving[mi]);
    }
    schedule.push(row);
    restPerRound.push(resting);
  }

  return { fixed, moving, nFixed, nMoving, rounds, schedule, restPerRound, fixedIsMale };
}

function generate(){
  document.getElementById('err').textContent='';
  if(!males.length||!females.length){
    document.getElementById('err').textContent='형제·자매 각 1명 이상 입력해주세요.';return;
  }
  const startTime=document.getElementById('startTime').value||'19:40';
  const shuffle = arr => [...arr].sort(()=>Math.random()-.5);
  const result = buildSchedule(shuffle(males), shuffle(females));
  const cvs = drawCanvas(result, startTime);
  const out=document.getElementById('out');
  out.innerHTML='';
  const wrap=document.createElement('div');
  wrap.style.cssText='margin-bottom:12px;text-align:center;overflow-x:auto';
  wrap.appendChild(cvs);out.appendChild(wrap);
  const dlB=document.createElement('button');
  dlB.className='dl-btn';
  dlB.textContent='📷 이미지 저장하기';
  dlB.onclick=()=>{
    const imgUrl=cvs.toDataURL('image/png');
    // 모달 오버레이
    const overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem';
    overlay.innerHTML=`
      <p style="color:#fff;font-size:15px;font-weight:500;margin-bottom:12px;text-align:center">👇 아래 이미지를 길게 눌러서 저장하세요</p>
      <img src="${imgUrl}" style="max-width:95%;max-height:75vh;border-radius:8px;background:#fff">
      <button onclick="this.parentElement.remove()" style="margin-top:16px;padding:10px 28px;background:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;color:#1a1a18">✕ 닫기</button>
    `;
    overlay.addEventListener('click',(e)=>{if(e.target===overlay)overlay.remove();});
    document.body.appendChild(overlay);
  };
  out.appendChild(dlB);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawCanvas(result, startTime){
  const { fixed, moving, nFixed, nMoving, rounds, schedule, restPerRound, fixedIsMale } = result;
  const hasRest = nMoving > nFixed;
  const totalCols = nFixed + (hasRest ? 1 : 0);

  const PX=2, MAR=16*PX, CL=70*PX, CW=68*PX, RH=38*PX, HH=64*PX, NH=46*PX, FT=24*PX;
  const W=MAR+CL+totalCols*CW+MAR;
  const H=MAR+HH+NH+rounds*RH+FT+MAR;

  const cvs=document.createElement('canvas');
  cvs.width=W; cvs.height=H;
  cvs.style.maxWidth='100%'; cvs.style.borderRadius='8px';
  const ctx=cvs.getContext('2d');

  // 색상: 고정=연두(남)/노랑(여), 이동=반대
  const FIX_BG   = fixedIsMale ? '#EAF3DE' : '#FAEEDA';
  const FIX_DARK = fixedIsMale ? '#27500A' : '#633806';
  const FIX_MID  = fixedIsMale ? '#3B6D11' : '#854F0B';
  const MOV_BG   = fixedIsMale ? '#FAEEDA' : '#EAF3DE';
  const MOV_DARK = fixedIsMale ? '#633806' : '#27500A';
  const MOV_MID  = fixedIsMale ? '#854F0B' : '#3B6D11';
  const R_BG='#EEEDFE', R_DARK='#3C3489', R_MID='#534AB7', R_LT='#CECBF6';
  const GRAY1='#F9F9F7', WH='#FFFFFF', BORDER='#D3D1C7';
  const X0=MAR+CL, Y0=MAR+HH;

  // 배경
  ctx.fillStyle=WH; ctx.fillRect(0,0,W,H);

  // 헤더
  ctx.fillStyle='#EAF3DE'; ctx.fillRect(0,0,W,MAR+HH);
  ctx.fillStyle='#3B6D11'; ctx.font=`600 ${17*PX}px sans-serif`; ctx.textAlign='center';
  ctx.fillText('🎡 빙글빙글룰렛', W/2, MAR+20*PX);
  ctx.font=`${10*PX}px sans-serif`; ctx.fillStyle='#27500A';
  ctx.fillText(`대화 ${dur}분 + 이동 5분 · 총 ${rounds}라운드 · ${startTime} 시작`, W/2, MAR+35*PX);
  ctx.fillText(fixedIsMale ? '형제 고정 / 자매 이동' : '자매 고정 / 형제 이동', W/2, MAR+49*PX);

  // 테이블 헤더 행 (고정자 이름)
  for(let t=0; t<nFixed; t++){
    const cx = X0+t*CW+CW/2;
    ctx.fillStyle=FIX_BG;
    roundRect(ctx, X0+t*CW+2, Y0+3, CW-4, NH-6, 5*PX); ctx.fill();
    ctx.fillStyle=FIX_DARK; ctx.font=`600 ${10*PX}px sans-serif`; ctx.textAlign='center';
    ctx.fillText(`T${t+1}`, cx, Y0+14*PX);
    ctx.font=`600 ${12*PX}px sans-serif`; ctx.fillStyle=FIX_MID;
    ctx.fillText(fixed[t], cx, Y0+28*PX);
    ctx.font=`${9*PX}px sans-serif`; ctx.fillStyle=FIX_DARK;
    ctx.fillText('(고정)', cx, Y0+40*PX);
  }

  // 휴식 테이블 헤더
  if(hasRest){
    const cx = X0+nFixed*CW+CW/2;
    ctx.fillStyle=R_BG;
    roundRect(ctx, X0+nFixed*CW+2, Y0+3, CW-4, NH-6, 5*PX); ctx.fill();
    ctx.fillStyle=R_DARK; ctx.font=`600 ${10*PX}px sans-serif`; ctx.textAlign='center';
    ctx.fillText(`T${nFixed+1}`, cx, Y0+14*PX);
    ctx.font=`600 ${11*PX}px sans-serif`; ctx.fillStyle=R_MID;
    ctx.fillText('☕ 휴식', cx, Y0+28*PX);
    ctx.font=`${9*PX}px sans-serif`; ctx.fillStyle=R_DARK;
    ctx.fillText('(대기석)', cx, Y0+40*PX);
  }

  // 라운드 행
  for(let r=0; r<rounds; r++){
    const ry = Y0+NH+r*RH;
    ctx.fillStyle = r%2===0 ? GRAY1 : WH;
    ctx.fillRect(MAR, ry, W-MAR*2, RH);

    // 라운드 레이블
    ctx.fillStyle=MOV_BG; ctx.fillRect(MAR, ry, CL, RH);
    ctx.fillStyle=MOV_DARK; ctx.font=`600 ${10*PX}px sans-serif`; ctx.textAlign='center';
    ctx.fillText(`${r+1}라운드`, MAR+CL/2, ry+13*PX);
    ctx.font=`${9*PX}px sans-serif`; ctx.fillStyle=MOV_MID;
    ctx.fillText(fmtT(startTime, r), MAR+CL/2, ry+25*PX);

    // 각 테이블 셀
    for(let t=0; t<nFixed; t++){
      const cx = X0+t*CW+CW/2, cy = ry+RH/2;
      const mi = schedule[r][t];
      ctx.fillStyle=MOV_BG;
      roundRect(ctx, X0+t*CW+3, ry+5, CW-6, RH-10, 4*PX); ctx.fill();
      ctx.fillStyle=MOV_DARK; ctx.font=`600 ${11*PX}px sans-serif`; ctx.textAlign='center';
      ctx.fillText(moving[mi], cx, cy+4);
    }

    // 휴식 셀
    if(hasRest){
      const cx = X0+nFixed*CW+CW/2, cy = ry+RH/2;
      const resting = restPerRound[r];
      ctx.fillStyle=R_BG;
      roundRect(ctx, X0+nFixed*CW+3, ry+5, CW-6, RH-10, 4*PX); ctx.fill();
      ctx.fillStyle=R_DARK; ctx.textAlign='center';
      if(resting.length===1){
        ctx.font=`600 ${10*PX}px sans-serif`;
        ctx.fillText(resting[0], cx, cy+4);
      } else if(resting.length>=2){
        const half=Math.ceil(resting.length/2);
        ctx.font=`${9*PX}px sans-serif`;
        ctx.fillText(resting.slice(0,half).join(', '), cx, cy-3);
        ctx.fillText(resting.slice(half).join(', '), cx, cy+9);
      }
    }
  }

  // 격자선
  ctx.strokeStyle=BORDER; ctx.lineWidth=.5*PX;
  for(let t=0; t<=totalCols; t++){
    const x=X0+t*CW;
    ctx.beginPath(); ctx.moveTo(x,Y0); ctx.lineTo(x,Y0+NH+rounds*RH); ctx.stroke();
  }
  for(let r=0; r<=rounds; r++){
    const y=Y0+NH+r*RH;
    ctx.beginPath(); ctx.moveTo(MAR,y); ctx.lineTo(W-MAR,y); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(MAR,Y0+NH); ctx.lineTo(W-MAR,Y0+NH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(MAR,Y0); ctx.lineTo(W-MAR,Y0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(MAR+CL,Y0); ctx.lineTo(MAR+CL,Y0+NH+rounds*RH); ctx.stroke();

  // 휴식 컬럼 구분선 강조
  if(hasRest){
    ctx.strokeStyle=R_LT; ctx.lineWidth=1.5*PX;
    const rx=X0+nFixed*CW;
    ctx.beginPath(); ctx.moveTo(rx,Y0); ctx.lineTo(rx,Y0+NH+rounds*RH); ctx.stroke();
  }

  // 외곽선
  ctx.strokeStyle=BORDER; ctx.lineWidth=1*PX;
  ctx.strokeRect(MAR,MAR,W-MAR*2,H-MAR*2);

  // 범례
  ctx.fillStyle='#B4B2A9'; ctx.font=`${8*PX}px sans-serif`; ctx.textAlign='center';
  ctx.fillText(
    (fixedIsMale?'연두=형제(고정) · 노랑=자매(이동)':'노랑=자매(고정) · 연두=형제(이동)')+' · 보라=휴식대기석 · 빙글빙글룰렛',
    W/2, H-MAR/2
  );
  return cvs;
}
</script>
</body>
</html>
